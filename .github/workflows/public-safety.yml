name: Public safety check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check helper syntax
        run: |
          python3 -m py_compile tools/check_public_safety.py
          python3 -m py_compile tools/build_pages_index.py

      - name: Check for accidentally committed secrets
        run: python3 tools/check_public_safety.py
