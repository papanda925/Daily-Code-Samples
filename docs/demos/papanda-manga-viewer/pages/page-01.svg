<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Papanda Manga Viewer 1ページ目</title><desc id="desc">Papandaが画像を切り替えるマンガビューアを試そうと話している</desc><rect width="1200" height="900" fill="#eef7ff"/><rect x="55" y="55" width="1090" height="790" rx="34" fill="#fff" stroke="#c9dff2" stroke-width="4"/><text x="90" y="125" font-family="sans-serif" font-size="42" font-weight="700" fill="#17324d">1 / 4　まずは画像を切り替える</text><rect x="520" y="180" width="545" height="250" rx="34" fill="#fff7d9" stroke="#e8c660" stroke-width="4"/><text x="565" y="260" font-family="sans-serif" font-size="40" font-weight="700" fill="#17324d">「1枚の長い画像じゃなくて、</text><text x="565" y="320" font-family="sans-serif" font-size="40" font-weight="700" fill="#17324d">ページを切り替えて</text><text x="565" y="380" font-family="sans-serif" font-size="40" font-weight="700" fill="#17324d">読めたら面白そう！」</text><circle cx="325" cy="420" r="210" fill="#ffffff" stroke="#17324d" stroke-width="6"/><ellipse cx="185" cy="250" rx="90" ry="105" fill="#1e2832"/><ellipse cx="465" cy="250" rx="90" ry="105" fill="#1e2832"/><ellipse cx="255" cy="395" rx="58" ry="78" fill="#1e2832" transform="rotate(18 255 395)"/><ellipse cx="395" cy="395" rx="58" ry="78" fill="#1e2832" transform="rotate(-18 395 395)"/><circle cx="275" cy="405" r="22" fill="#fff"/><circle cx="375" cy="405" r="22" fill="#fff"/><ellipse cx="325" cy="485" rx="34" ry="25" fill="#1e2832"/><path d="M305 515 Q325 545 345 515" fill="none" stroke="#1e2832" stroke-width="9" stroke-linecap="round"/><circle cx="235" cy="500" r="24" fill="#ffb6bd" opacity=".7"/><circle cx="415" cy="500" r="24" fill="#ffb6bd" opacity=".7"/><rect x="185" y="650" width="280" height="95" rx="18" fill="#dfeaf3"/><text x="225" y="710" font-family="sans-serif" font-size="34" font-weight="700" fill="#17324d">Papanda</text><text x="560" y="610" font-family="sans-serif" font-size="34" fill="#45627d">ボタンを押すと、同じ画面の画像が</text><text x="560" y="660" font-family="sans-serif" font-size="34" fill="#45627d">page-01.svg → page-02.svg のように</text><text x="560" y="710" font-family="sans-serif" font-size="34" fill="#45627d">差し替わります。</text></svg>