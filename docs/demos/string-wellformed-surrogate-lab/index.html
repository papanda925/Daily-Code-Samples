<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTF-16整合性ラボ</title><style>body{font-family:system-ui,sans-serif;max-width:780px;margin:2rem auto;padding:1rem;line-height:1.7}button,textarea{font:inherit;padding:.5rem;margin:.3rem}textarea{display:block;width:95%;min-height:4rem}pre{white-space:pre-wrap;background:#edf1f5;color:#18222c;padding:1rem}</style></head><body><main><h1>isWellFormed() / toWellFormed() 実験</h1><p>架空の文字列を検査します。通信・保存はありません。</p><div id="buttons"><button data-key="normal">通常文字</button><button data-key="emoji">絵文字</button><button data-key="broken">不正サロゲート</button></div><label for="value">文字列</label><textarea id="value">東京ABC</textarea><button id="run">調べる</button><h2>結果</h2><pre id="result" role="status" aria-live="polite"></pre><p>不正サロゲートは入力欄で置換される場合があります。専用ボタン直後の結果を確認してください。</p></main><script src="app.js"></script></body></html>
