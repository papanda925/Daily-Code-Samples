<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>structuredClone transfer比較教材</title>
<style>body{font:16px/1.7 system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem}label{display:inline-block;margin:.5rem}button,input,select{font:inherit;padding:.45rem}pre{white-space:pre-wrap;background:#eef3f8;padding:1rem;min-height:5rem}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #145aa2}</style></head>
<body><h1>structuredClone：コピーと所有権の移動を比較</h1>
<p>架空のバイト列だけをブラウザー内で扱います。通信・保存は行いません。</p>
<label>方式 <select id="action"><option value="copy">通常コピー</option><option value="transfer">transfer</option></select></label>
<label>バイト数 <input id="bytes" type="number" min="1" max="32" value="8"></label>
<p><button id="run" type="button">比較を実行</button> <button id="reset" type="button">初期化</button></p>
<p id="status" role="status">方式を選び、実行してください。</p><p id="values"></p>
<h2>観察ログ</h2><pre id="output" aria-live="polite"></pre>
<script src="./app.js" defer></script></body></html>
