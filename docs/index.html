<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daily Code Samples のブラウザで動かせるライブデモ一覧です。">
  <title>Daily Code Samples - Live Demos</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; line-height: 1.7; }
    h1 { margin-bottom: .35rem; }
    .lead { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 28px; }
    .card { border: 1px solid currentColor; border-radius: 12px; padding: 20px; }
    .card h2 { margin-top: 0; font-size: 1.2rem; }
    .card a { font-weight: 700; }
    .note { margin-top: 32px; font-size: .95rem; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Daily Code Samples</h1>
    <p class="lead">ブラウザでそのまま試せるライブデモをまとめています。</p>

    <section class="grid" aria-label="ライブデモ一覧">
      <article class="card">
        <h2>Geolocation API + Leaflet</h2>
        <p>ブラウザの現在位置を取得し、Leaflet と OpenStreetMap で地図に表示します。</p>
        <p><a href="./demos/geolocation-leaflet/">現在位置デモを開く</a></p>
      </article>
    </section>

    <p class="note">
      位置情報・カメラ・マイクなどの権限を使うデモは、ユーザー操作後にだけ権限を要求する方針です。
      各デモの注意事項を確認してから利用してください。
    </p>
  </main>
</body>
</html>
