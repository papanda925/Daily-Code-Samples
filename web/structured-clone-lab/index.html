<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScriptの浅いコピーと深いコピー</title><style>body{font:1rem/1.65 system-ui,sans-serif;max-width:850px;margin:2rem auto;padding:0 1rem;color:#173047;background:#f6f9fd}main{background:white;border:1px solid #c5d9e8;border-radius:12px;padding:1.5rem}button{font:inherit;background:#e8f3ff;border:1px solid #426a90;border-radius:8px;padding:.5rem 1rem}button:focus-visible{outline:3px solid #005ea8;outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf5fc;border-left:4px solid #246b9c;padding:1rem}</style></head><body><main><h1>浅いコピーと深いコピーを比べる</h1><p>架空の設定データで <code>{...object}</code> と <code>structuredClone()</code> の違いを観察します。通信・保存・個人情報の入力はありません。</p><button type="button" id="run">もう一度比較する</button><pre id="output" aria-label="比較結果">JavaScriptを読み込み中です。</pre><p id="status" role="status" aria-live="polite"></p><p>毎回、架空データを新しく作って比較します。</p><noscript>JavaScriptが無効です。READMEをご覧ください。</noscript></main><script src="./clone.js"></script><script src="./app.js"></script></body></html>
