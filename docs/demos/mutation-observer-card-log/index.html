<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MutationObserverでカードの変化を観察</title>
<style>
:root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
body { max-width: 820px; margin: auto; padding: 1rem; line-height: 1.65; color: #20304b; background: #f5f8fc; }
main { background: white; border-radius: 12px; padding: clamp(1rem, 3vw, 2rem); }
h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
.controls { display: flex; flex-wrap: wrap; gap: .5rem; }
button { font: inherit; border: 1px solid #1d5a99; border-radius: 7px; padding: .45rem .75rem; background: #e9f3ff; color: #143f70; cursor: pointer; }
button:focus-visible { outline: 3px solid #e4a600; outline-offset: 2px; }
button:disabled { opacity: .55; cursor: not-allowed; }
#cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: .6rem; padding: 0; list-style: none; }
.card { border: 2px solid #8eb8df; border-radius: 8px; padding: .7rem; background: #f1f7ff; display: flex; flex-direction: column; }
.card[data-state="done"] { border-color: #368568; background: #edf9f3; }
.state { font-size: .95rem; }
#summary { font-weight: bold; }
#log { max-height: 18rem; overflow-y: auto; border: 1px solid #c5d6e9; border-radius: 6px; padding: .6rem .6rem .6rem 2rem; }
#log:empty::after { content: "まだ通知はありません"; color: #4d5e73; }
.note { border-left: 4px solid #2d6ea8; padding: .5rem .8rem; background: #f1f7ff; }
@media print { body { background: white; } button { display: none; } #log { max-height: none; } }
</style>
<script src="./app.js" defer></script>
</head>
<body>
<main>
<h1>カードの変化を見つける実験</h1>
<p>「カードを追加」→「先頭の状態を切替」→「監視を停止」の順に押して、下の通知ログを見てください。</p>
<p class="note">個人情報・APIキー・位置情報・外部ライブラリは不要です。変更するのはこのページ内の架空カードだけです。</p>
<section aria-labelledby="cards-heading">
<h2 id="cards-heading">カード一覧（<output id="card-count">2</output>枚）</h2>
<div class="controls">
<button id="add" type="button">カードを追加</button>
<button id="toggle" type="button">先頭の状態を切替</button>
<button id="remove" type="button">最後のカードを削除</button>
</div>
<ul id="cards">
<li class="card" data-state="pending"><strong>カードA</strong><span class="state">未完了</span></li>
<li class="card" data-state="pending"><strong>カードB</strong><span class="state">未完了</span></li>
</ul>
</section>
<section aria-labelledby="watch-heading">
<h2 id="watch-heading">監視と通知ログ</h2>
<div class="controls">
<button id="stop" type="button">監視を停止</button>
<button id="resume" type="button">監視を再開</button>
<button id="clear" type="button">ログを消す</button>
</div>
<p id="summary" role="status" aria-live="polite">準備中</p>
<ol id="log" aria-label="変更の通知履歴"></ol>
<p>停止中もカードは操作できますが、通知は記録されません。再開しても停止中の変更はさかのぼって表示されません。</p>
</section>
</main>
</body>
</html>
