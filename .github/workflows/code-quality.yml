name: Daily Code quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and parse checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r python3 -m py_compile

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: PowerShell parse
        shell: pwsh
        run: |
          $allErrors = @()

          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseErrors
              ) | Out-Null

              if ($parseErrors.Count -gt 0) {
                Write-Host "::error file=$($_.FullName)::PowerShell parse error"
                $parseErrors | ForEach-Object { Write-Host $_.Message }
                $allErrors += $parseErrors
              }
            }

          if ($allErrors.Count -gt 0) {
            throw "PowerShell parse check failed: $($allErrors.Count) error(s)"
          }

      - name: JSON parse
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          errors = []
          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  with path.open("r", encoding="utf-8-sig") as f:
                      json.load(f)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              raise SystemExit("JSON parse check failed:\n" + "\n".join(errors))

          print("JSON parse check OK")
          PY

  repository-safety:
    name: Public safety check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run public safety scanner
        run: python3 _repo-tools/check_public_safety.py
