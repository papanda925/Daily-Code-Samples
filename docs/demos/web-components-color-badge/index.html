<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="独自HTMLタグを作り、属性を変えるだけでShadow DOM内の見た目が変わることを確認します。"><title>Web Components：自作バッジを組み立てる | Daily Code</title><link rel="stylesheet" href="../_shared/interactive-lab.css"></head>
<body><main><p><a href="../../">Daily Codeトップ</a></p><h1>Web Components：自作バッジを組み立てる</h1><p>独自HTMLタグを作り、属性を変えるだけでShadow DOM内の見た目が変わることを確認します。</p><h2>触ってみる</h2><label>文言 <input id="label" value="準備完了" maxlength="24"></label><label>色 <select id="tone"><option value="blue">青</option><option value="pink">ピンク</option><option value="green">緑</option></select></label><p><color-badge id="badge" label="準備完了" tone="blue"></color-badge></p><pre id="output" role="status">カスタム要素を作りました。</pre><h2>仕組み</h2><p>customElements.defineで独自要素を登録。attachShadowでスタイル領域を隔離し、observedAttributesで属性変更を受ける。</p><p><a href="https://github.com/papanda925/Daily-Code-Samples/tree/main/web/web-components-color-badge">説明READMEとコードを読む</a></p></main><footer>GitHub Pages上で動く学習用デモ。未対応ブラウザーでは機能が使えないことがあります。</footer><script src="./app.js" defer></script></body></html>
