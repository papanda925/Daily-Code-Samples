<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTF-8分割とTextDecoderのstream比較</title>
<style>body{font:1rem/1.7 system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#17212b}main{background:#f2f7fc;border:1px solid #aac4d9;border-radius:12px;padding:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1rem;border-radius:6px}button,input{font:inherit}button{padding:.4rem 1rem}label{display:block;margin:1rem 0}</style>
</head><body><h1>UTF-8が途中で切れたら？</h1><p>日本語と絵文字を含む文字列をバイト列に変換し、途中で2つに分割して復号します。外部通信はありません。</p>
<main><p>元の文字列：<strong id="expected"></strong></p><p>UTF-8バイト列（16進数）</p><pre id="raw"></pre>
<label>前半のバイト数 <input id="split" type="number" min="1" step="1" inputmode="numeric"></label>
<button type="button" id="run">比較する</button><pre id="result" role="status" aria-live="polite"></pre></main>
<p>途中のバイト列が不完全な場合、個別decodeは置換文字（�）を含むことがあります。stream:trueは次のチャンクへ持ち越します。</p>
<script src="./app.js" defer></script></body></html>
