<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Gridの空き列実験</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#17304a}label{display:block;margin:.5rem 0}input{width: min(100%,300px)}input:focus-visible{outline:3px solid #145aa2}.viewport{overflow-x:auto;border:1px solid #94a3b8;padding:8px}.grid{display:grid;gap:12px;background:#e2e8f0;grid-auto-rows:minmax(60px,auto)}.fill{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.fit{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.card{box-sizing:border-box;min-width:0;padding:8px;background:#205a89;color:white;overflow-wrap:anywhere}.readout{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}h2{font-size:1.1rem}
</style></head><body><main><h1>auto-fill と auto-fit の違い</h1><p>同じ幅・カード数で、空き列が残るか比較する。狭い画面では各枠を横にスクロールできる。</p>
<label for="width">枠の幅 <output id="widthValue" for="width">540</output> px</label><input id="width" type="range" min="120" max="660" step="1" value="540">
<label for="count">カード数 <output id="countValue" for="count">2</output></label><input id="count" type="range" min="1" max="8" value="2">
<h2>auto-fill（空き列を保持）</h2><div class="viewport"><div id="fill" class="grid fill"></div></div><p id="fillResult" class="readout"></p>
<h2>auto-fit（空き列を折り畳む）</h2><div class="viewport"><div id="fit" class="grid fit"></div></div><p id="fitResult" class="readout"></p>
<noscript>JavaScriptが無効です。READMEの最小例を参照してください。</noscript></main><script src="app.js"></script></body></html>
