<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="画像データとJSONを使って、ブラウザで前後のページへ切り替える最小マンガビューアのデモです。">
  <title>Papanda Manga Viewer v0.1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="viewer" aria-labelledby="viewer-title">
    <header class="viewer__header">
      <p class="eyebrow">Daily Code Samples / Live Demo</p>
      <h1 id="viewer-title">Papanda Manga Viewer v0.1</h1>
      <p>画像とJSONの付帯データを読み込み、前へ・次へでページを切り替えます。</p>
    </header>

    <section class="manga" aria-live="polite">
      <div class="manga__frame">
        <img id="page-image" src="" alt="">
      </div>

      <div class="manga__meta">
        <p id="page-counter" class="counter">- / -</p>
        <h2 id="page-title">読み込み中...</h2>
        <p id="page-caption"></p>
        <ul id="page-tags" class="tags" aria-label="ページのタグ"></ul>
      </div>

      <nav class="controls" aria-label="マンガのページ操作">
        <button id="prev-button" type="button">← 前のページ</button>
        <button id="next-button" type="button">次のページ →</button>
      </nav>

      <p id="status" class="status" role="status"></p>
    </section>

    <section class="how-it-works">
      <h2>このデモで確認できること</h2>
      <p><code>manga.json</code> から画像パス・タイトル・説明・タグを読み、JavaScriptで同じ画面の内容を差し替えています。左右の矢印キーでも切り替えられます。</p>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
