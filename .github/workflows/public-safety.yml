name: Public safety check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/check_public_safety.py
          python3 -m py_compile tools/validate_sample.py
          python3 -m py_compile tools/build_pages_index.py
          python3 -m py_compile automation/ubuntu/run_daily_code_once.py
          python3 -m py_compile automation/ubuntu/generate_daily_sample_once.py

      - name: Check shell syntax
        run: bash -n automation/ubuntu/dispatch_with_daily_code.sh automation/ubuntu/install.sh

      - name: Check for accidentally committed secrets
        run: python3 tools/check_public_safety.py
