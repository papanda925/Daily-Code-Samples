<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="入力した短い文章を読み上げ、声・速度・高さの違いを試せます。"><title>Web Speech API：読み上げ声と速さを変える | Daily Code</title><link rel="stylesheet" href="../_shared/interactive-lab.css"></head>
<body><main><p><a href="../../">Daily Codeトップ</a></p><h1>Web Speech API：読み上げ声と速さを変える</h1><p>入力した短い文章を読み上げ、声・速度・高さの違いを試せます。</p><h2>触ってみる</h2><label for="words">読み上げる文章</label><textarea id="words" rows="3" maxlength="160">こんにちは。ブラウザーの音声合成を体験しています。</textarea><label>声 <select id="voice"><option value="">既定の音声</option></select></label><label>速さ <input id="rate" type="range" min="5" max="18" value="10"></label><label>高さ <input id="pitch" type="range" min="5" max="18" value="10"></label><p><button id="speak" type="button">読み上げ</button> <button id="stop" type="button">停止</button></p><p id="status" role="status">音声の再生には操作が必要です。</p><h2>仕組み</h2><p>SpeechSynthesisUtteranceを作り、speechSynthesis.speakでキューへ渡す。cancelで読み上げを解除する。</p><p><a href="https://github.com/papanda925/Daily-Code-Samples/tree/main/web/speech-synthesis-voice-lab">説明READMEとコードを読む</a></p></main><footer>GitHub Pages上で動く学習用デモ。未対応ブラウザーでは機能が使えないことがあります。</footer><script src="./app.js" defer></script></body></html>
