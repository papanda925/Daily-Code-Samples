<!doctype html>
<meta charset="utf-8">
<title>Clipboard API demo</title>
<label>コピーする文字 <input id="text" value="papanda925"></label>
<button id="copy">コピー</button>
<pre id="result">READY</pre>
<script>
const input = document.querySelector("#text");
const result = document.querySelector("#result");

document.querySelector("#copy").addEventListener("click", async () => {
  result.textContent = "RUNNING";
  if (!navigator.clipboard?.writeText) {
    result.textContent = "FAILED: Clipboard API is unavailable";
    return;
  }
  try {
    await navigator.clipboard.writeText(input.value);
    result.textContent = "SUCCESS: copied " + input.value.length + " characters";
  } catch (error) {
    result.textContent = "FAILED: " + error.name + ": " + error.message;
  }
});
</script>
