<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>色の組合せで読みやすさを比べる｜WCAGコントラスト実験</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173047;background:#f6f9fd;line-height:1.6}
body{max-width:850px;margin:2rem auto;padding:0 1rem}
main{background:white;border:1px solid #bfd2e5;border-radius:14px;padding:1.5rem}
fieldset{border:1px solid #b6cfe5;border-radius:10px;display:flex;flex-wrap:wrap;gap:1rem}
label{display:flex;align-items:center;gap:.5rem}
button{padding:.55rem .8rem;border:1px solid #456e91;border-radius:8px;background:#eef6ff;color:#173047;margin:.3rem}
button:focus-visible,input:focus-visible{outline:3px solid #005ea8;outline-offset:2px}
#preview{padding:1.5rem;border:1px solid #888;border-radius:10px;margin:1rem 0;font-size:1rem}
#ratio{font-size:1.6rem;font-weight:bold}
#status{background:#eef6ff;border-left:4px solid #1b689c;padding:.6rem}
</style></head><body><main>
<h1>🎨 色の組合せで「読める」を比べよう</h1>
<p>架空の文字色と背景色を選ぶだけ。画像・個人情報・通信・保存はありません。</p>
<fieldset><legend>色を変更する</legend>
<label for="fg">文字色 <input id="fg" type="color" value="#767676"></label>
<label for="bg">背景色 <input id="bg" type="color" value="#ffffff"></label>
</fieldset>
<div aria-label="色の例">
<button type="button" data-fg="#000000" data-bg="#ffffff">黒と白</button>
<button type="button" data-fg="#777777" data-bg="#ffffff">灰色 #777777</button>
<button type="button" data-fg="#767676" data-bg="#ffffff">灰色 #767676</button>
<button type="button" id="swap">文字色と背景色を交換</button>
</div>
<div id="preview">これは見本の文章です。小さい文字ほど、色の差が重要になります。</div>
<p>コントラスト比：<output id="ratio">—</output></p>
<p id="normal"></p><p id="large"></p><p id="aaa"></p>
<p id="status" role="status" aria-live="polite"></p>
<p>この判定は不透明なsRGBの文字と背景のみを対象とします。画像、透明度、グラデーション、実際のフォントや画面の見え方は別途確認してください。</p>
<noscript>JavaScriptが無効です。READMEに計算方法とテスト手順があります。</noscript>
</main><script src="./contrast.js"></script><script src="./app.js"></script></body></html>
