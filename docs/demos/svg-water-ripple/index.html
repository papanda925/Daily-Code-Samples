<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SVGのノイズと置換フィルターを組み合わせ、波紋の細かさと強さを操作します。"><title>SVG Filters：水面がゆがむ | Daily Code</title><link rel="stylesheet" href="../_shared/interactive-lab.css"></head>
<body><main><p><a href="../../">Daily Codeトップ</a></p><h1>SVG Filters：水面がゆがむ</h1><p>SVGのノイズと置換フィルターを組み合わせ、波紋の細かさと強さを操作します。</p><h2>触ってみる</h2><label>波の強さ <input id="scale" type="range" min="0" max="75" value="18"></label><label>細かさ <input id="frequency" type="range" min="1" max="9" value="3"></label><svg viewBox="0 0 720 260" role="img" aria-label="水色と青色の帯が波のように変形する図" style="width:100%;border-radius:16px;background:#071730"><defs><linearGradient id="grad" x2="1" y2="1"><stop stop-color="#00d4ff"/><stop offset="1" stop-color="#7765ff"/></linearGradient><filter id="water" x="-15%" y="-30%" width="130%" height="160%"><feTurbulence id="noise" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap id="displacement" in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g filter="url(#water)"><rect x="30" y="60" width="660" height="130" rx="60" fill="url(#grad)"/><circle cx="180" cy="126" r="50" fill="#effffd" opacity=".8"/><text x="300" y="145" font-size="58" font-weight="bold" fill="#08283a">WATER</text></g></svg><p id="status" role="status">スライダーを動かしてください。</p><h2>仕組み</h2><p>feTurbulenceがノイズ画像を作り、feDisplacementMapがそれを置換量に変換する。imgではなくSVG属性をスライダーから直接更新。</p><p><a href="https://github.com/papanda925/Daily-Code-Samples/tree/main/web/svg-water-ripple">説明READMEとコードを読む</a></p></main><footer>GitHub Pages上で動く学習用デモ。未対応ブラウザーでは機能が使えないことがあります。</footer><script src="./app.js" defer></script></body></html>
