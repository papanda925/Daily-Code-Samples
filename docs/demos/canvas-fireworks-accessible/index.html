<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas花火実験：クリックで広がる粒子</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193e58;background:#f3f8fc}
*{box-sizing:border-box}body{max-width:850px;margin:0 auto;padding:20px}
h1{font-size:clamp(1.4rem,4vw,2rem);line-height:1.4}
.notice{background:#eaf5fc;border-left:5px solid #247ab0;padding:13px 16px;border-radius:7px}
.panel{background:#fff;border:1px solid #cee1ee;border-radius:12px;padding:16px;margin:15px 0}
canvas{display:block;width:100%;height:320px;border-radius:9px;cursor:crosshair;touch-action:manipulation}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
button{background:#176a9c;color:#fff;border:0;border-radius:7px;padding:10px 14px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffae36;outline-offset:2px}
button:disabled{opacity:.6;cursor:not-allowed}
label{display:flex;align-items:center;gap:8px}
#status{padding:11px 13px;background:#eaf4fb;border-radius:7px;min-height:3rem}
a{color:#0b5d92}
@media(max-width:550px){canvas{height:260px}.controls{align-items:stretch}button{flex:1}}
</style>
</head>
<body>
<p><a href="https://github.com/papanda925/Daily-Code-Samples/tree/main/web/canvas-fireworks-accessible">📘 教材READMEと完全版</a></p>
<h1>🎆 Canvasで花火を打ち上げる</h1>
<div class="notice"><strong>まず試す</strong><br>「花火を打つ」を押すか、夜空をクリック。粒子数を変えて違いを見てみましょう。音・位置情報・ログインは使いません。</div>
<div class="panel">
<canvas id="sky" aria-label="花火の粒子を描く夜空。下のボタンでも操作できます">Canvas対応ブラウザで開いてください。</canvas>
<div class="controls">
<button type="button" id="launch">花火を打つ</button>
<button type="button" id="pause">一時停止</button>
<button type="button" id="clear">消去</button>
</div>
<label for="count">粒子数 <input id="count" type="range" min="12" max="60" step="12" value="24"><output id="count-label" for="count">24 個</output></label>
<p id="status" role="status" aria-live="polite">読み込み中</p>
</div>
<p>💡 動きが苦手な方の設定（prefers-reduced-motion）では静止画になります。明滅や音はありません。描画が止まっても数値は文字で確認できます。</p>
<p>この教材は学習用です。保存・送信機能はありません。</p>
<script src="./app.js"></script>
</body>
</html>
