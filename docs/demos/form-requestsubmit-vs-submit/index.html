<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>requestSubmitとsubmitの違い</title><style>body{font-family:system-ui,sans-serif;max-width:740px;margin:2rem auto;padding:0 1rem;line-height:1.7}button,input{font:inherit;padding:.5rem;margin:.3rem}pre{background:#eef3f8;padding:1rem;white-space:pre-wrap;min-height:5rem}button:focus-visible,input:focus-visible{outline:3px solid #1264b4}</style></head><body><h1>フォーム送信の検証を観察</h1><p>氏名を空欄にして「requestSubmit」を押すとinvalid、入力後はsubmitが記録されます。通信はしません。</p><form id="demo"><label>氏名（必須）<input id="person" name="person" required maxlength="30"></label><button id="send" name="action" value="save" type="submit">通常送信</button></form><p><button id="request" type="button">requestSubmitを呼ぶ</button><button id="native" type="button">submit()との違いを表示</button><button id="reset" type="button">リセット</button></p><p id="note" role="status"></p><h2>イベントログ</h2><pre id="log" aria-live="polite"></pre><script src="./app.js" defer></script></body></html>
