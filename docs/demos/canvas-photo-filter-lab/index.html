<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="端末から選んだ画像を送信せずブラウザー内でプレビューし、彩度とぼかしを調整します。"><title>File API + Canvas：写真加工研究室 | Daily Code</title><link rel="stylesheet" href="../_shared/interactive-lab.css"><style>#photo{width:100%;height:auto;background:#e8edf4;border-radius:16px}label{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}</style></head>
<body><main><p><a href="../../">Daily Codeトップ</a></p><h1>File API + Canvas：写真加工研究室</h1><p>端末から選んだ画像を送信せずブラウザー内でプレビューし、彩度とぼかしを調整します。</p><h2>触ってみる</h2><label>画像ファイル <input id="file" type="file" accept="image/*"></label><label>彩度 <input id="saturation" type="range" min="0" max="200" value="100"></label><label>ぼかし <input id="blur" type="range" min="0" max="12" value="0"></label><button id="reset" type="button">効果を戻す</button><canvas id="photo" width="720" height="420" aria-label="加工した写真のプレビュー"></canvas><p id="status" role="status">画像を選んでください。画像はアップロードしません。</p><h2>仕組み</h2><p>File APIで選択したBlobのObject URLをImageへ渡し、CanvasRenderingContext2D.filterをdrawImageに適用する。Object URLは後で解放する。</p><p><a href="https://github.com/papanda925/Daily-Code-Samples/tree/main/web/canvas-photo-filter-lab">説明READMEとコードを読む</a></p></main><footer>GitHub Pages上で動く学習用デモ。未対応ブラウザーでは機能が使えないことがあります。</footer><script src="./app.js" defer></script></body></html>
