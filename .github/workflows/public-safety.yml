name: Public safety check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check safety tool syntax
        run: python3 -m py_compile _repo-tools/check_public_safety.py

      - name: Check for accidentally committed secrets
        run: python3 _repo-tools/check_public_safety.py
