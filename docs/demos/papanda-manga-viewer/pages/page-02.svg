<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Papanda Manga Viewer 2ページ目</title><desc id="desc">画像に加えてJSONの付帯データを扱う説明</desc><rect width="1200" height="900" fill="#effcf3"/><rect x="55" y="55" width="1090" height="790" rx="34" fill="#fff" stroke="#cce8d4" stroke-width="4"/><text x="90" y="125" font-family="sans-serif" font-size="42" font-weight="700" fill="#17324d">2 / 4　画像だけでなく付帯データも読む</text><rect x="90" y="190" width="460" height="510" rx="28" fill="#f7fbff" stroke="#c9dff2" stroke-width="4"/><text x="130" y="255" font-family="sans-serif" font-size="36" font-weight="700" fill="#267fd3">manga.json</text><text x="130" y="330" font-family="monospace" font-size="28" fill="#17324d">{</text><text x="165" y="380" font-family="monospace" font-size="28" fill="#17324d">"image": "page-02.svg",</text><text x="165" y="430" font-family="monospace" font-size="28" fill="#17324d">"title": "付帯データ",</text><text x="165" y="480" font-family="monospace" font-size="28" fill="#17324d">"tags": ["JSON","漫画"]</text><text x="130" y="530" font-family="monospace" font-size="28" fill="#17324d">}</text><rect x="650" y="210" width="420" height="210" rx="30" fill="#fff7d9" stroke="#e8c660" stroke-width="4"/><text x="695" y="285" font-family="sans-serif" font-size="38" font-weight="700" fill="#17324d">「画像の場所だけじゃなく、</text><text x="695" y="340" font-family="sans-serif" font-size="38" font-weight="700" fill="#17324d">タイトルやタグも</text><text x="695" y="395" font-family="sans-serif" font-size="38" font-weight="700" fill="#17324d">一緒に持てるね！」</text><circle cx="805" cy="610" r="130" fill="#ffffff" stroke="#17324d" stroke-width="5"/><ellipse cx="720" cy="505" rx="58" ry="70" fill="#1e2832"/><ellipse cx="890" cy="505" rx="58" ry="70" fill="#1e2832"/><ellipse cx="760" cy="600" rx="38" ry="52" fill="#1e2832"/><ellipse cx="850" cy="600" rx="38" ry="52" fill="#1e2832"/><circle cx="780" cy="610" r="15" fill="#fff"/><ci