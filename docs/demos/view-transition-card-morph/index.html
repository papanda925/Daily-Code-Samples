<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="カードを拡大・縮小して、DOM更新を滑らかにつなぐ仕組みを観察します。"><title>CSS View Transitions：カードが変身する | Daily Code</title><link rel="stylesheet" href="../_shared/interactive-lab.css"><style>.stage{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:230px}.morph,.filler{padding:20px;border-radius:22px;background:hsl(var(--hue,210) 85% 60%);color:#14223c;min-width:0}.filler{background:#e6e9fb}.morph{view-transition-name:feature-card;align-content:center}.morph.expanded{grid-column:span 2;min-height:180px;border-radius:54px;transform:rotate(-2deg)}.morph strong{font-size:clamp(1.4rem,4vw,2rem)}@media(prefers-reduced-motion:reduce){::view-transition-old(feature-card),::view-transition-new(feature-card){animation:none}}</style></head>
<body><main><p><a href="../../">Daily Codeトップ</a></p><h1>CSS View Transitions：カードが変身する</h1><p>カードを拡大・縮小して、DOM更新を滑らかにつなぐ仕組みを観察します。</p><h2>触ってみる</h2><button id="toggle" type="button">カードを変身</button> <label>色相 <input id="hue" type="range" min="0" max="330" value="210"></label><div class="stage"><article id="hero" class="morph"><strong>タップで変身</strong><p>CSSとDOM変更をアニメーションでつなぐ</p></article><article class="filler">隣のカード</article></div><p id="status" role="status">通常表示です。</p><h2>仕組み</h2><p>document.startViewTransition()はDOMの変更前後を捉える。view-transition-nameを1要素へ与えると対応関係を指定できる。</p><p><a href="https://github.com/papanda925/Daily-Code-Samples/tree/main/web/view-transition-card-morph">説明READMEとコードを読む</a></p></main><footer>GitHub Pages上で動く学習用デモ。未対応ブラウザーでは機能が使えないことがあります。</footer><script src="./app.js" defer></script></body></html>
