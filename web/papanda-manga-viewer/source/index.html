<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papanda Manga Viewer v0.1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="viewer">
    <header>
      <h1>Papanda Manga Viewer v0.1</h1>
      <p>JSONで管理した画像と付帯データを、前へ・次へで切り替える最小ビューアです。</p>
      <p><a href="../../../docs/demos/papanda-manga-viewer/">ライブデモ</a></p>
    </header>
    <section aria-live="polite">
      <img id="page-image" src="" alt="">
      <p id="page-counter">- / -</p>
      <h2 id="page-title">読み込み中...</h2>
      <p id="page-caption"></p>
      <ul id="page-tags"></ul>
      <nav>
        <button id="prev-button" type="button">← 前のページ</button>
        <button id="next-button" type="button">次のページ →</button>
      </nav>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
